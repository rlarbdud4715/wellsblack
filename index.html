<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>흑색건강</title>
<meta name="description" content="흑색건강 업무 대시보드 바로가기">
<meta name="robots" content="noindex">
<!-- 홈 화면 아이콘: 아이폰은 apple-touch-icon, 안드로이드는 manifest의 아이콘을 쓴다 -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="흑색건강">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#16181d;--muted:#6b7280;--line:#e5e7eb;--btn:#1f2430;--btn-ink:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
main{width:100%;max-width:420px;background:var(--card);border-radius:24px;padding:32px 24px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.logo{width:88px;height:88px;border-radius:20px;display:block;margin:0 auto 16px;border:1px solid var(--line)}
h1{font-size:22px;margin:0 0 4px;text-align:center}
.sub{color:var(--muted);text-align:center;margin:0 0 24px;font-size:14px}
.btn{display:block;width:100%;text-align:center;background:var(--btn);color:var(--btn-ink);text-decoration:none;font-weight:700;padding:14px;border-radius:14px;font-size:16px}
.guide{margin-top:24px;border-top:1px solid var(--line);padding-top:20px}
.guide h2{font-size:15px;margin:0 0 8px}
.guide ol{margin:0 0 16px;padding-left:20px;color:#374151;font-size:14px}
.guide li{margin:2px 0}
.note{font-size:12px;color:var(--muted);margin:0}
.wait{text-align:center;color:var(--muted)}
.hide{display:none}
</style>
</head>
<body>
<main>
  <img class="logo" src="icon-192.png" alt="흑색건강 로고">
  <h1>흑색건강 업무 대시보드</h1>
  <p class="sub" id="sub">회사 구글 계정으로 접속합니다</p>

  <!-- 홈 화면 아이콘으로 열었을 때: 바로 대시보드로 이동 -->
  <p class="wait hide" id="wait">대시보드를 여는 중…</p>

  <div id="browser">
    <a class="btn" id="open" href="#">대시보드 열기</a>
    <section class="guide">
      <h2>아이폰에 아이콘 만들기</h2>
      <ol>
        <li><b>사파리</b>에서 이 페이지를 연 상태로</li>
        <li>아래 <b>공유 버튼(□↑)</b> → <b>홈 화면에 추가</b></li>
        <li>이름이 "흑색건강"인지 확인하고 <b>추가</b></li>
      </ol>
      <h2>안드로이드에 아이콘 만들기</h2>
      <ol>
        <li><b>크롬</b>에서 이 페이지를 연 상태로</li>
        <li>오른쪽 위 <b>⋮</b> → <b>홈 화면에 추가</b>(또는 <b>앱 설치</b>)</li>
      </ol>
      <p class="note">대시보드로 넘어간 뒤가 아니라 <b>이 페이지에서</b> 추가해야 회사 로고 아이콘이 생깁니다. 이전에 만든 "흑" 글자 아이콘은 길게 눌러 지워주세요.</p>
    </section>
  </div>
</main>
<script>
// ▼ 대시보드 주소(Apps Script 웹앱 /exec 주소). 배포 주소가 바뀌면 이 한 줄만 고치면 된다.
var DASHBOARD_URL = 'https://script.google.com/a/macros/ourmut.com/s/AKfycby-hzZMDt9K813LXfC2UGSmBMWZZprj2b9sD05o6Y1IOpKz07BtcToZAzVhIJj3_iYi/exec';
(function () {
  var ok = /^https:\/\/script\.google\.com\/(a\/macros\/[^/]+\/|macros\/)s\/[A-Za-z0-9_-]+\/exec$/.test(DASHBOARD_URL);
  var open = document.getElementById('open');
  if (!ok) { open.textContent = '대시보드 주소 설정 필요'; open.removeAttribute('href'); open.style.opacity = '.5'; return; }
  open.href = DASHBOARD_URL;
  // 홈 화면 아이콘으로 실행된 경우(주소창 없는 앱 화면)에만 자동으로 넘어간다.
  var standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (standalone) {
    document.getElementById('browser').className = 'hide';
    document.getElementById('sub').className = 'hide';
    document.getElementById('wait').className = 'wait';
    location.replace(DASHBOARD_URL);
  }
})();
</script>
</body>
</html>
